version: '3.8'

services:
  # 1. Laravel App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: patchops-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    networks:
      - patchops-network
    depends_on:
      - redis

  # 2. Redis Cache & Queue
  redis:
    image: redis:alpine
    container_name: patchops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - patchops-network

networks:
  patchops-network:
    driver: bridge

volumes:
  redisdata: